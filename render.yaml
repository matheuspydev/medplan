# Render (render.com), plano gratuito: um serviço só, API + interface compilada.
#
# A cada deploy o banco SINTÉTICO é recriado do zero (6.000 perfis, menos de 1 s).
# O disco do plano gratuito é temporário: o que for registrado pela tela some quando o
# serviço reinicia ou dorme (15 min sem acesso). Nunca use com dado real de paciente:
# o SQLite do protótipo não tem RLS nem log de auditoria.
services:
  - type: web
    name: medplan
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      cd web && npm ci && npm run build && cd .. &&
      python -m medplan.bootstrap --perfis 6000 --forcar
    startCommand: python -m uvicorn medplan.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/referencias
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: NODE_VERSION
        value: 24.22.1
