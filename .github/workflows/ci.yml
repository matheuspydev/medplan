# Roda a cada push e pull request: testes do motor/API, testes da interface e build.
# É o que protege as regras clínicas de regressão (percentual sempre com n e IC,
# "dados insuficientes" abaixo do n mínimo, aviso de viés literal do motor).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Motor e API (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests -t .
      - name: Banco sintético sobe do zero
        run: python -m medplan.bootstrap --perfis 200 --forcar

  frontend:
    name: Interface (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
